name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: marketplaces
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: cachix/cachix-action@v17
        with:
          name: wvhulle
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Run all checks on the release commit
        run: nix flake check --print-build-logs
      - name: Build the extension package
        run: |
          nix build --print-build-logs .#vsix
          cp result/*.vsix .
          echo "VSIX_PATH=$(ls ./*.vsix)" >> "$GITHUB_ENV"
      - name: Attach the package to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" "$VSIX_PATH" --clobber
      - name: Install the locked publishing tools
        run: nix develop --command pnpm install --frozen-lockfile
      - name: Publish to the Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: nix develop --command pnpm exec vsce publish --packagePath "$VSIX_PATH"
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: nix develop --command pnpm exec ovsx publish "$VSIX_PATH"
